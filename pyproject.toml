[project]
name = "loadtracer"
readme = "README.md"
dynamic = ['version', 'description']
authors = [
    { name = "Connor Ferster", email = "connor@structuralpython.com" }
]
requires-python = ">=3.12"
dependencies = [
    "papermodels>=0.16.1",
    "loadbearing-wall>=0.2.1",
    "PyniteFEA==1.1.2",
    "safer>=5.1.0",
    "jsonchain>=0.5.0",
    "pynite-tools>=0.6.7",
    "load-distribution>=0.1.7",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.4.0",
]
