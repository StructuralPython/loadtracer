[project]
name = "loadtracer"
readme = "README.md"
dynamic = ['version', 'description']
authors = [
    { name = "Connor Ferster", email = "connor@structuralpython.com" }
]
requires-python = ">=3.12"
dependencies = [
    "papermodels>=0.22.0",
    "loadbearing-wall>=0.5.0",
    "PyniteFEA>=1.6.2",
    "safer>=5.1.0",
    "jsonchain>=0.5.0",
    "pynite-tools>=0.6.7",
    "load-distribution>=0.1.7",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "ipykernel>=6.29.5",
    "nbconvert>=7.17.1",
    "pandas>=3.0.6",
    "pytest>=8.4.0",
]

[tool.uv.sources]
# Develop against the sibling papermodels checkout. CI installs with --no-sources.
papermodels = { path = "../papermodels", editable = true }
