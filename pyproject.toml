[project]
name = "loadtracer"
readme = "README.md"
dynamic = ['version', 'description']
authors = [
    { name = "Connor Ferster", email = "connor@structuralpython.com" }
]
requires-python = ">=3.12"
dependencies = [
    "papermodels>=0.11.0",
    "pygraphviz>=1.14",
    "loadbearing_wall>=0.1.0",
    "PyniteFEA==1.1.2",
    "pynite-tools",
    "jsonchain",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
